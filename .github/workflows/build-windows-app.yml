name: Build Windows App

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "logo.png"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siete-windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out desktop source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
            logo.png
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Windows icon
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick.app -y
          }
          New-Item -ItemType Directory -Force -Path desktop/build | Out-Null
          magick logo.png -resize 256x256! desktop/build/icon.ico

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Siete-Document-Portal-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: Siete Document Portal for Windows
          body: |
            Download the .exe file below to install Siete Document Portal on Windows.
            Portal content stays current automatically from the GitHub repository.
          files: desktop/dist/*.exe
          make_latest: true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · Siete Document Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #172033;
            background: #f7eef5;
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
        }
        main { max-width: 440px; padding: 32px; background: #fff; border-radius: 18px; }
        h1 { color: #851765; }
        p { color: #5f6875; line-height: 1.55; }
        button {
            padding: 11px 18px;
            color: #fff;
            background: #851765;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Siete Document Portal</h1>
        <p>An internet connection is needed to load the latest documents from GitHub.</p>
        <button type="button" onclick="location.href='https://malamal32.github.io/SieteMaintenanceV2/'">Try Again</button>
    </main>
</body>
</html>
